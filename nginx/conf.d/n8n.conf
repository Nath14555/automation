# louna-agent — Nginx vhost for n8n.louna-co.com
#
# Pre-flight: Let's Encrypt certs must exist at:
#   /etc/letsencrypt/live/n8n.louna-co.com/fullchain.pem
#   /etc/letsencrypt/live/n8n.louna-co.com/privkey.pem
# See scripts/setup.sh for the certbot bootstrap.

# --- internal health endpoint (no logging) ---
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else gets redirected to HTTPS on the proper host
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- n8n.louna-co.com (HTTPS) ---
server {
    listen 443 ssl;
    http2 on;
    server_name n8n.louna-co.com;

    ssl_certificate     /etc/letsencrypt/live/n8n.louna-co.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.louna-co.com/privkey.pem;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- proxy to n8n container ---
    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket support (n8n editor live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # n8n long-running executions
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # Let's Encrypt http-01 (renewal also goes through 80, but keep this for safety)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
